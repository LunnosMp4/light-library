<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Loïc's Photos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="noise-background" aria-hidden="true"></div>

    <main class="gallery">
      <nav class="album-nav" id="album-nav" aria-label="Albums">
        <ul class="album-nav-list" id="album-nav-list"></ul>
      </nav>
      <div id="grid" class="masonry-gallery" aria-live="polite"></div>
      <div id="empty" class="empty hidden">No photos yet. Upload the first set.</div>
    </main>

    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
      <figure class="polaroid-frame">
        <div class="polaroid-img-wrapper">
          <img id="lightbox-image" class="polaroid-img" alt="Full size" />
        </div>
        <figcaption id="exif-data" class="exif-data hidden"></figcaption>
        <a
          id="polaroid-action"
          class="polaroid-action-btn"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View original image"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
        </a>
      </figure>
    </div>

    <script src="/app.js?v=7" defer></script>
  </body>
</html>
