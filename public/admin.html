<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loïc's Photos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=7" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  </head>
  <body class="admin-body">
    <div class="noise-background" aria-hidden="true"></div>

    <main id="login-view" class="login-wrap">
      <section class="panel">
        <div class="panel-title">Admin</div>
        <h1>Sign in</h1>
        <form id="login-form" class="stack">
          <label class="field">
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="primary" type="submit">Login</button>
        </form>
        <div id="login-status" class="status"></div>
      </section>
    </main>

    <div id="dashboard" class="dashboard hidden">
      <aside class="sidebar">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="6" width="18" height="14" rx="3" />
            <circle cx="12" cy="13" r="3.5" />
            <circle cx="12" cy="13" r="0.75" fill="currentColor" stroke="none" />
            <path d="M8.5 6l1.2-2h4.6L15.5 6" />
          </svg>
          <span>Loïc's Photos</span>
        </div>

        <nav class="nav">
          <button class="nav-item active" data-view="upload" type="button">
            Upload
          </button>
          <button class="nav-item" data-view="library" type="button">
            Library
          </button>
        </nav>

        <section class="sidebar-section">
          <div class="sidebar-title">Albums</div>
          <form id="album-form" class="album-form">
            <input
              type="text"
              name="name"
              placeholder="New album name"
              autocomplete="off"
              required
            />
            <button class="primary" type="submit">Create</button>
          </form>
          <div id="album-status" class="status"></div>
          <div id="album-list" class="album-list"></div>
        </section>

        <div class="sidebar-footer">
          <div id="storage" class="storage hidden"></div>
          <button id="logout" class="ghost" type="button">Logout</button>
        </div>
      </aside>

      <main class="main">
        <section id="view-upload" class="view active">
          <h1>Upload</h1>
          <form id="upload-form" class="stack">
            <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Upload photos">
              <input
                id="file-input"
                type="file"
                name="photos"
                multiple
                accept="image/jpeg,image/png,image/heic,image/heif"
                class="dropzone-input"
              />
              <div class="dropzone-inner">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="17 8 12 3 7 8" />
                  <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                <p>Drag &amp; drop photos or <span class="dropzone-browse">click to browse</span></p>
                <small>JPG, PNG, HEIC, HEIF</small>
              </div>
            </div>
            <div id="preview-queue" class="preview-queue hidden"></div>
            <div class="field">
              <span>Add to albums</span>
              <div id="upload-albums" class="album-grid"></div>
            </div>
            <button class="primary" type="submit">Upload</button>
          </form>
          <div class="progress">
            <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
          </div>
          <div id="upload-status" class="status"></div>
        </section>

        <section id="view-library" class="view">
          <div class="library-head">
            <h1 id="library-title">Library</h1>
            <button id="select-all" class="ghost" type="button">Select all</button>
          </div>
          <div id="admin-gallery" class="admin-gallery"></div>
          <div id="selection-bar" class="selection-bar hidden">
            <span id="selection-count" class="selection-count">0 selected</span>
            <div class="selection-actions">
              <button id="selection-clear" class="selection-clear" type="button">
                Clear
              </button>
              <button id="selection-delete" class="selection-delete" type="button">
                Delete
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel">
        <div class="modal-head">
          <img id="edit-thumb" alt="" />
          <div class="modal-heading">
            <h2>Edit albums</h2>
            <div id="edit-filename" class="muted"></div>
          </div>
          <button class="modal-close" type="button" data-close aria-label="Close">
            &times;
          </button>
        </div>
        <div id="edit-albums" class="album-grid"></div>
        <div class="modal-actions">
          <button id="edit-cancel" class="ghost" type="button">Cancel</button>
          <button id="edit-save" class="primary" type="button">Save</button>
        </div>
      </div>
    </div>

    <script src="/admin.js?v=7" defer></script>
  </body>
</html>
