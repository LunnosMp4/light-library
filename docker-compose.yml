version: "3.8"

services:
  photo-stream:
    build: .
    ports:
      - "5500:5500"
    environment:
      PORT: 5500
      ADMIN_USER: admin
      ADMIN_PASS: change-me
      SESSION_SECRET: change-me-now
      THUMB_SIZE: 1600
      THUMB_QUALITY: 85
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./public:/app/public
    restart: unless-stopped
